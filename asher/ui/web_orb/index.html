<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data: blob: qrc:; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' qrc:; connect-src 'self' file: blob:; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-src 'none'; base-uri 'none'"
    />
    <title>ASHER Companion Orb</title>
    <style>
      :root {
        color-scheme: dark;
        background: #02050b;
        font-family: "Segoe UI", Inter, Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #orb-root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #02050b;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(circle at 50% 47%, transparent 43%, rgba(1, 4, 10, 0.22) 70%, rgba(1, 3, 8, 0.72) 100%),
          linear-gradient(to bottom, rgba(1, 4, 10, 0.16), transparent 25%, transparent 76%, rgba(1, 4, 10, 0.28));
      }

      .status {
        position: fixed;
        z-index: 2;
        left: 50%;
        bottom: 4.6%;
        width: min(80%, 620px);
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
        text-shadow: 0 0 20px rgba(174, 239, 255, 0.44);
      }

      #state {
        color: rgba(242, 252, 255, 0.94);
        font-size: clamp(14px, 2.4vmin, 21px);
        font-weight: 650;
        letter-spacing: 0.24em;
      }

      #message {
        min-height: 1.4em;
        margin-top: 7px;
        overflow: hidden;
        color: rgba(184, 216, 229, 0.72);
        font-size: clamp(10px, 1.65vmin, 14px);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #renderer-error {
        position: fixed;
        inset: auto 12px 12px 12px;
        display: none;
        color: #b9c9d2;
        font-size: 11px;
        text-align: center;
      }

      #camera-source {
        position: fixed;
        width: 2px;
        height: 2px;
        left: -10000px;
        top: -10000px;
        opacity: 0;
        pointer-events: none;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three/three.module.min.js",
          "three/addons/": "./vendor/three/addons/"
        }
      }
    </script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  </head>
  <body>
    <main id="orb-root" aria-label="ASHER three-dimensional energy orb"></main>
    <div class="vignette" aria-hidden="true"></div>
    <section class="status" aria-live="polite">
      <div id="state">STANDBY</div>
      <div id="message">Say “Hey Asher”</div>
    </section>
    <div id="renderer-error" role="status"></div>
    <video id="camera-source" muted playsinline aria-hidden="true"></video>
    <script type="module" src="./bridge.js"></script>
  </body>
</html>
